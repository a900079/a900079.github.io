const items = RAW.split("\n").map(l => {
  const [slug, title, code, note] = l.split("|");
  const [m, t, v] = code.split(".");
  if (m === "x") return {slug, title, removed:true, reason:t, note: note || ""};
  return {slug, title, mod:m, tag:t, ver:v==="v", note: note || ""};
});
const kept = items.filter(i => !i.removed), removed = items.filter(i => i.removed);
const count = k => kept.filter(i => i.tag === k).length;
document.getElementById("stats").innerHTML = [
  [items.length,"文章总数"],[kept.length,"保留"],[count("c"),"核心必读"],
  [removed.filter(i=>i.reason==="o").length,"移除·过时"],[removed.filter(i=>i.reason==="d").length,"移除·重复"]
].map(([n,l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("") + '<div class="stat" id="readStat"></div>';

let filter = "all", showRm = false, q = "", hideRead = false;
// 已读记录：存在本浏览器的 localStorage，笔记页可以导出 / 导入
const RKEY = "llm-kb-read";
let read = {};
try { read = JSON.parse(localStorage.getItem(RKEY)) || {}; } catch {}
const saveRead = () => { try { localStorage.setItem(RKEY, JSON.stringify(read)); } catch {} };
function readStat(){
  const n = kept.filter(i => read[i.slug]).length;
  document.getElementById("readStat").innerHTML = `<b>${n}</b><span>已读（共 ${kept.length}）</span>`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const order = {c:0,a:1,p:2};
function row(i){
  const tags = i.removed ? `<span class="tag t-${i.reason}">${TAGS[i.reason]}</span>`
    : `<span class="tag t-${i.tag}">${TAGS[i.tag]}</span>${i.ver?'<span class="tag t-v">注意版本</span>':""}`;
  return `<div class="it${read[i.slug]?" read":""}"><input type="checkbox" class="rd" data-slug="${i.slug}" title="标记已读"${read[i.slug]?" checked":""}><a href="${BASE+i.slug}" target="_blank" rel="noopener">${esc(i.title)}${i.note?`<span class="note">${esc(i.note)}</span>`:""}</a>${tags}</div>`;
}
function match(i){
  if (hideRead && read[i.slug]) return false;
  if (q && !(i.title + i.note).toLowerCase().includes(q)) return false;
  if (i.removed) return true;
  if (filter === "all") return true;
  if (filter === "v") return i.ver;
  return i.tag === filter;
}
function render(){
  let html = "", nav = "";
  for (const [k,[name,desc]] of Object.entries(MODS)) {
    const list = kept.filter(i => i.mod === k && match(i)).sort((a,b) => order[a.tag]-order[b.tag]);
    nav += `<a href="#m-${k}"><span>${name}</span><small>${list.length}</small></a>`;
    if (!list.length) continue;
    html += `<section id="m-${k}"><h2>${name}</h2><p class="d">${desc}</p><div class="list">${list.map(row).join("")}</div></section>`;
  }
  if (showRm) for (const [r,[name,desc]] of Object.entries(RM)) {
    const list = removed.filter(i => i.reason === r && match(i));
    nav += `<a href="#r-${r}"><span>已移除·${TAGS[r]}</span><small>${list.length}</small></a>`;
    if (!list.length) continue;
    html += `<section id="r-${r}" class="removed"><h2>已移除：${name}</h2><p class="d">${desc}</p><div class="list">${list.map(row).join("")}</div></section>`;
  }
  document.getElementById("out").innerHTML = html || '<div class="list"><div class="empty">没有匹配的文章</div></div>';
  document.getElementById("nav").innerHTML = nav;
}
document.querySelectorAll(".f[data-t]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".f[data-t]").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.t; render();
});
document.getElementById("showRm").onclick = e => { showRm = !showRm; e.target.classList.toggle("on", showRm); render(); };
document.getElementById("q").oninput = e => { q = e.target.value.trim().toLowerCase(); render(); };
document.getElementById("hideRead").onclick = e => { hideRead = !hideRead; e.target.classList.toggle("on", hideRead); render(); };
document.getElementById("out").addEventListener("change", e => {
  if (!e.target.classList.contains("rd")) return;
  const s = e.target.dataset.slug;
  if (e.target.checked) read[s] = new Date().toISOString().slice(0, 10); else delete read[s];
  e.target.parentElement.classList.toggle("read", e.target.checked);
  saveRead(); readStat();
});
render(); readStat();
